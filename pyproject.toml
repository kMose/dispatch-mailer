[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-mailer"
version = "1.0.0"
description = "Single-account, spreadsheet-driven mailer with a dry-run default"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "openpyxl>=3.1",
  "aiosmtplib>=3.0",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "keyring>=24.0",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pytest-cov>=5.0",
  "aiosmtpd>=1.4",
  "pyinstaller>=6.0",
]

[project.scripts]
dispatch = "dispatch.cli:main"

[project.gui-scripts]
dispatch-gui = "dispatch.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dispatch*"]

[tool.setuptools.package-data]
dispatch = ["templates/starters/*.json", "templates/*.html", "templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["dispatch"]
omit = ["dispatch/ui/*", "dispatch/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
